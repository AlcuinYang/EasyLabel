# 合成刺激的算子参数。数值是示例，正式取值应在 E0 确定参照之后由预实验定。
# 每个算子按 方向 → 档位 → 参数 组织；生成任务 CSV 用 operator / direction / strength 引用。
version: 1
feather_px: 12            # 局部编辑掩码的高斯羽化（主图像素）
operators:
  tone:                   # OKLab L 围绕中位数缩放：down = 影调压缩，up = 过头
    down: {1: 0.85, 2: 0.70, 3: 0.55}
    up:   {1: 1.15, 2: 1.30, 3: 1.45}
  veil:                   # 与 sRGB 128 灰在线性光中混合：混灰色罩
    down: {1: 0.08, 2: 0.16, 3: 0.24}
  chroma:                 # OKLab 色度缩放：up = 饱和过度
    up:   {1: 1.20, 2: 1.40, 3: 1.60}
  joint:                  # 联合：按顺序依次施加
    down: {1: {tone: 0.85, veil: 0.08}, 2: {tone: 0.70, veil: 0.16}}
