[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easylabel"
version = "1.0.0.dev0"
description = "Within-scene perceptual annotation service: grid, pairwise and region tasks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "pydantic>=2.6",
  "pyyaml>=6", "numpy>=1.24", "scipy>=1.10", "networkx>=3.2", "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
easylabel = "easylabel.cli:main"

[tool.setuptools.packages.find]
include = ["easylabel*", "easylabel_analysis*"]

[tool.setuptools.package-data]
easylabel = ["server/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
